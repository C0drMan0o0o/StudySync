services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studysync
      POSTGRES_USER: studysync
      POSTGRES_PASSWORD: studysync
    command:
      - "postgres"
      - "-c"
      - "max_connections=600"
      - "-c"
      - "deadlock_timeout=200ms"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysync -d studysync"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studysync
      SPRING_DATASOURCE_USERNAME: studysync
      SPRING_DATASOURCE_PASSWORD: studysync
      JWT_SECRET: dev-only-secret-change-me-dev-only-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
