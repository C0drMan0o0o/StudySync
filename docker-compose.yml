services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studysync
      POSTGRES_USER: studysync
      POSTGRES_PASSWORD: studysync
    command:
      - "postgres"
      - "-c"
      - "max_connections=600"
      - "-c"
      - "deadlock_timeout=200ms"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
