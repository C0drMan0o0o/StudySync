spring:
  application:
    name: studysync
  datasource:
    url: jdbc:postgresql://localhost:5432/studysync
    username: studysync
    password: studysync
    hikari:
      maximum-pool-size: 500
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  expiration-ms: 3600000

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 500
    accept-count: 10000
    max-connections: 20000
    connection-timeout: 20000
