spring:
  application:
    name: studysync
  datasource:
    url: jdbc:postgresql://localhost:5432/studysync
    username: studysync
    password: studysync
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  expiration-ms: 3600000

server:
  port: 8080
